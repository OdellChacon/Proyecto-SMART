<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ institucion }}</title></head>
<body style="margin:0;padding:0;background:#F7F5F1;font-family:'Source Sans 3',Arial,sans-serif;color:#1C1B19;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F5F1;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E0DCD3;border-radius:12px;">
        <tr><td style="background:#0F2A47;border-radius:12px 12px 0 0;padding:20px 32px;color:#FFFFFF;font-size:18px;font-weight:600;">{{ institucion }}</td></tr>
        <tr><td style="padding:32px;font-size:18px;line-height:28px;">
          {% block contenido %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #E0DCD3;font-size:14px;line-height:20px;color:#5B5750;">
          Este correo se envió automáticamente desde {{ sitio }}. Si no reconoces esta acción, puedes ignorarlo.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
